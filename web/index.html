<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>拾记 · Local Notes</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><aside><div class="brand"><span class="logo">拾</span><div>拾记<small>LOCAL NOTES</small></div></div><button id="new" class="primary">＋ 随手记</button><nav><button data-view="notes" class="active">▤ 笔记 <span id="note-count"></span></button><button data-view="tasks">☑ 待办 <span id="task-count"></span></button><button data-view="favorites">☆ 收藏</button></nav><div class="folder-label">当前笔记目录</div><div id="root-label">样本笔记</div><button id="choose" class="quiet">选择本地目录 ↗</button><div class="aside-bottom"><span class="dot"></span> 本地文件 · 离线可用<small>同步由 Syncthing 负责</small></div></aside>
<section class="collection"><header><div class="eyebrow">YOUR EVERYDAY SPACE</div><h1 id="view-title">所有笔记</h1><input id="search" placeholder="搜索标题与正文…" aria-label="搜索笔记"></header><div id="filters"><button data-filter="recent" class="active">最近编辑</button><button data-filter="folder">按目录</button></div><div id="items"></div></section>
<main><div id="empty" class="empty"><div>✎</div><h2>留一点空间，给想法。</h2><p>选择一篇笔记，或者写下第一句话。</p></div><div id="editor" hidden><div class="toolbar"><button id="back">‹ 列表</button><span id="file-path"></span><button id="star" aria-label="收藏">☆</button><button id="rename">移动 / 改名</button></div><div class="document"><input id="title" aria-label="笔记标题" placeholder="无标题"><div class="meta"><span id="save-state">已保存到本地</span><button id="mode">阅读</button></div><textarea id="body" placeholder="从这里开始…\n\n用 - [ ] 记下待办" spellcheck="false"></textarea><article id="reading" hidden></article></div><footer>MARKDOWN <span>文件属于你，随时可以用其他工具打开。</span></footer></div></main></div>
<div id="notice" role="status" hidden></div><div id="conflict" hidden><div class="dialog"><h2>文件在其他地方发生了修改</h2><p>你的编辑还在这里。可以另存一份，也可以查看磁盘上的版本。</p><button id="copy" class="primary">将我的编辑另存为副本</button><button id="reload">载入磁盘版本（放弃当前编辑）</button></div></div><script type="module" src="app.js"></script></body></html>
