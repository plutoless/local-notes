<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Notes maintainer catalogue</title>
<link rel="stylesheet" href="../../web/style.css"><link rel="stylesheet" href="../../build/web/assets/react-host.css">
<style>body{max-width:960px;margin:auto;padding:24px}section{margin-block:32px}.examples{display:flex;flex-wrap:wrap;gap:8px}.swatch{padding:12px;border:1px solid var(--line);border-radius:8px}.ui-field{max-width:600px}</style>
<div id="foundation"></div><section id="react-library"></section>
<script type="module">
import {mountFoundationCatalogue,mountLibraryCatalogue,noteFieldsView,actionControl} from '../../build/web/assets/react-host.js';
import {icon,drawer} from '../../build/web/presentation.js';
const panel=drawer({id:'catalogue-drawer',title:'核对保存结果',onDismiss:()=>panel.hide()});
const fields=noteFieldsView(panel.body);fields.show([{id:'catalogue-dialog-field',label:'核对内容',value:'长中文内容与键盘焦点'}]);
panel.footer.append(actionControl('关闭',()=>panel.hide()).host);
mountFoundationCatalogue(document.querySelector('#foundation'),()=>panel.open(panel.body.querySelector('input')));
mountLibraryCatalogue(document.querySelector('#react-library'),icon);
</script></html>
